<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard CCTV Bandung</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a2e;
            overflow: hidden; /* Menghilangkan scroll ganda */
        }

        /* Header yang ramping untuk HP */
        header {
            background-color: #16213e;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #4eff4e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        /* Container utama agar iframe memenuhi layar */
        .main-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 45px); /* Potong tinggi header */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Tombol bantuan floating */
        .info-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(233, 69, 96, 0.9);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 11px;
            pointer-events: none; /* Agar tidak menghalangi klik peta */
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header>
        <span><span class="status-dot"></span> LIVE BANDUNG</span>
        <span id="clock" style="font-size: 11px; opacity: 0.8;"></span>
    </header>

    <div class="main-container">
        <!-- Memuat peta seluruh titik CCTV Bandung -->
        <iframe 
            src="https://pelindung.bandung.go.id/cctv" 
            allow="geolocation; microphone; camera">
        </iframe>
        
        <div class="info-overlay">
            Klik ikon kamera pada peta untuk melihat video
        </div>
    </div>

    <script>
        // Update jam tiap detik
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds} WIB`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
