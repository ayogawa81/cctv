<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring CCTV Seluruh Bandung</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            overflow: hidden; /* Supaya dashboard terasa seperti aplikasi full screen */
        }
        header {
            background-color: #1f1f1f;
            color: white;
            padding: 15px;
            text-align: center;
            border-bottom: 3px solid #e94560;
        }
        .container {
            width: 100vw;
            height: calc(100vh - 70px); /* Potong tinggi header */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .info-tab {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <strong>LIVE MONITORING CCTV SELURUH KOTA BANDUNG</strong>
    </header>

    <div class="container">
        <!-- Menggunakan portal peta langsung untuk cakupan seluruh wilayah -->
        <iframe 
            src="https://pelindung.bandung.go.id/cctv" 
            title="CCTV Bandung Map"
            allowfullscreen>
        </iframe>
    </div>

    <div class="info-tab">
        Titik Kamera: Seluruh Persimpangan & Area Publik Bandung
    </div>

</body>
</html>
