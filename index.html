<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV Bandung Raya</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: sans-serif; background-color: #1a1a2e; color: white; overflow: hidden;
        }
        nav { display: flex; background-color: #16213e; border-bottom: 2px solid #e94560; }
        .tab-btn {
            flex: 1; padding: 12px; border: none; background: none;
            color: white; font-weight: bold; cursor: pointer; font-size: 12px; transition: 0.3s;
        }
        .tab-btn.active { background-color: #e94560; }
        .main-container { width: 100%; height: calc(100vh - 45px); position: relative; }
        
        /* Frame Styling */
        iframe { width: 100%; height: 100%; border: none; display: none; }
        iframe.active { display: block; }

        /* Pesan jika server down */
        .error-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #888; font-size: 14px; z-index: -1;
        }
        .info-bar {
            position: absolute; bottom: 0; width: 100%; background: rgba(0, 0, 0, 0.7);
            font-size: 10px; text-align: center; padding: 5px 0;
        }
    </style>
</head>
<body>

    <nav>
        <button class="tab-btn active" onclick="switchCCTV('kota', this)">KOTA</button>
        <button class="tab-btn" onclick="switchCCTV('kabupaten', this)">KABUPATEN</button>
        <button class="tab-btn" onclick="switchCCTV('jabar', this)">JALUR PROVINSI</button>
    </nav>

    <div class="main-container">
        <!-- Layer pesan jika iframe gagal muat -->
        <div class="error-msg">
            <p>Memuat Kamera...</p>
            <p style="font-size: 11px;">Jika layar tetap kosong, server penyedia mungkin sedang offline.</p>
        </div>

        <!-- Kota Bandung -->
        <iframe id="iframe-kota" class="active" src="https://pelindung.bandung.go.id/cctv"></iframe>
        
        <!-- Kabupaten Bandung (Alternative Link) -->
        <iframe id="iframe-kabupaten" src="https://atcs.bandungkab.go.id/"></iframe>

        <!-- Jalur Provinsi (Dishub Jabar) - Biasanya lebih stabil untuk area perbatasan -->
        <iframe id="iframe-jabar" src="http://atcs.dishub.jabarprov.go.id/view-cctv"></iframe>
    </div>

    <div class="info-bar">
        <span id="clock"></span> | Monitoring Bandung Raya
    </div>

    <script>
        function switchCCTV(wilayah, element) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('iframe').forEach(frame => frame.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('iframe-' + wilayah).classList.add('active');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID') + " WIB";
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
