<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV Bandung Raya (Kota & Kabupaten)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
            background-color: #1a1a2e;
            color: white;
            overflow: hidden;
        }

        /* Navigasi Tab untuk pindah wilayah */
        nav {
            display: flex;
            background-color: #16213e;
            border-bottom: 2px solid #e94560;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: #e94560;
        }

        .main-container {
            width: 100%;
            height: calc(100vh - 45px); /* Tinggi layar dikurangi tinggi nav */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Sembunyikan semua iframe secara default */
        }

        iframe.active {
            display: block; /* Tampilkan hanya yang dipilih */
        }

        .info-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            font-size: 10px;
            text-align: center;
            padding: 5px 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <nav>
        <button class="tab-btn active" onclick="switchCCTV('kota', this)">KOTA BANDUNG</button>
        <button class="tab-btn" onclick="switchCCTV('kabupaten', this)">KAB. BANDUNG</button>
    </nav>

    <div class="main-container">
        <!-- Iframe Kota Bandung -->
        <iframe id="iframe-kota" class="active" src="https://pelindung.bandung.go.id/cctv"></iframe>
        
        <!-- Iframe Kabupaten Bandung (ATCS Kab Bandung) -->
        <iframe id="iframe-kabupaten" src="https://atcs.bandungkab.go.id/"></iframe>
    </div>

    <div class="info-bar">
        Monitoring Real-Time Bandung Raya | <span id="clock"></span>
    </div>

    <script>
        function switchCCTV(wilayah, element) {
            // Hapus kelas active dari semua tombol
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // Hapus kelas active dari semua iframe
            document.querySelectorAll('iframe').forEach(frame => frame.classList.remove('active'));

            // Aktifkan yang dipilih
            element.classList.add('active');
            document.getElementById('iframe-' + wilayah).classList.add('active');
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID') + " WIB";
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
