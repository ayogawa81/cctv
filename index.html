<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCTV Bandung Raya Mobile</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Segoe UI', sans-serif; background-color: #1a1a2e; color: white; overflow: hidden;
        }
        
        /* Header Ramping */
        header {
            background-color: #16213e;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .main-container {
            width: 100%;
            height: calc(100vh - 85px); /* Potong header dan footer */
            position: relative;
            background-color: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Footer Navigasi / Tombol Darurat */
        footer {
            height: 45px;
            background-color: #16213e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #333;
        }

        .nav-btn {
            color: white;
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            background: #e94560;
            padding: 8px 12px;
            border-radius: 4px;
            text-align: center;
        }

        /* Animasi Loading jika layar hitam */
        .loading-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <span>🔴 LIVE BANDUNG RAYA</span>
        <span id="clock">00:00:00 WIB</span>
    </header>

    <div class="main-container">
        <div class="loading-text">
            <p>Memuat Peta CCTV...</p>
            <p style="font-size: 10px;">Jika tetap hitam, gunakan tombol di bawah.</p>
        </div>
        
        <!-- Menggunakan Portal Jabar yang mencakup Kota & Kabupaten secara luas -->
        <iframe 
            src="http://atcs.dishub.jabarprov.go.id/view-cctv" 
            allowfullscreen>
        </iframe>
    </div>

    <footer>
        <a href="https://pelindung.bandung.go.id/cctv" target="_blank" class="nav-btn">PORTAL KOTA</a>
        <a href="https://atcs.bandungkab.go.id/" target="_blank" class="nav-btn" style="background: #0f3460;">PORTAL KAB</a>
        <a href="http://atcs.dishub.jabarprov.go.id/view-cctv" target="_blank" class="nav-btn" style="background: #28a745;">PORTAL PROV</a>
    </footer>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID') + " WIB";
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
